<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อัลกุรอาน-ตัฟซีรมุคตะศ็อร </title>
<meta name="description" content="คัมภีร์อัลกุรอาน พร้อมตัฟซีรภาษาไทย มุคตะศ็อร (Mukhtasar) และคำแปลภาษาอังกฤษ พร้อมเสียงอ่านบทกุรอาน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header>
    <h1>อัลกุรอาน-ตัฟซีรมุคตะศ็อร</h1>
  <!-- <p>
  <span class="badge">by Tech for Ummah v.1.1</span>
  </p> -->


  <!-- Surah Navigation Bar -->
  <div class="surah-nav-card">
    <!-- previous/next removed per request -->
    <div class="surah-info-center">
      <div class="surah-badge-row">
        <div class="surah-sub-meta">
          <span id="surahNameEn">Al-Fatihah</span>
          <span>•</span>
          <span id="surahAyahCount">7 อายะฮ์</span>
        </div>
      </div>
    </div>
    <button class="btn-sel" id="openSurahSel">📖 เลือกซูเราะห์</button>
    <button class="btn-action btn-hamburger" id="btnToggleNav" title="เมนู">☰</button>
    <div class="nav-actions">
      <button class="btn-action" id="btnToggleMode" title="เปลี่ยนรูปแบบการอ่าน">🎴 การ์ด</button>
      <button class="btn-action" id="btnPlaySurah" title="ฟังเสียงอ่านทั้งซูเราะห์">▶ ฟังซูเราะห์</button>
      <button class="btn-action" id="btnOpenBookmarks" title="รายการโปรด">⭐</button>
      <button class="btn-action btn-settings" id="btnOpenSettings" title="ตั้งค่า">⚙️ ตั้งค่า</button>
    </div>
  </div>
</header>
  
  <!-- Ayahs Render Area -->
  <div id="loading-msg">
    <div class="spinner"></div>
    <span>กำลังโหลดข้อมูลอัลกุรอาน...</span>
  </div>

  <div id="ayahs-container"></div>
  <div id="mushaf-container" style="display:none"></div>
</div>

<!-- Surah Selection Modal -->
<div class="modal-overlay" id="surahModal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>เลือกซูเราะห์ (Select Surah)</h2>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-search">
      <input type="text" id="surahSearch" placeholder="ค้นหาซูเราะห์ (ชื่อไทย, English, ชื่ออาหรับ, หมายเลข)...">
    </div>
    <div class="surah-grid" id="surahGrid"></div>
  </div>
</div>

<!-- Bookmarks Modal -->
<div class="modal-overlay" id="bookmarksModal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>รายการโปรดที่บันทึกไว้ (Bookmarks)</h2>
      <button class="modal-close" id="closeBookmarksModal">&times;</button>
    </div>
    <div id="bookmarksList" style="padding:20px; overflow-y:auto; flex:1"></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>การตั้งค่า (Settings)</h2>
      <button class="modal-close" id="closeSettingsModal">&times;</button>
    </div>
    <div style="padding:16px; display:flex; flex-direction:column; gap:8px">
      <label>ตำแหน่งเริ่มต้น (Default position)</label>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <select id="settingsSurahSelect" style="width:240px;padding:6px">
          <option value="">เลือกซูเราะห์</option>
        </select>
        <input type="number" id="settingsAyahInput" min="1" placeholder="อายะฮ์ (ไม่บังคับ)" style="width:140px;padding:6px" />
      </div>
      <hr />
        <label>การแสดงผลภาษา (Display languages)</label>
        <div style="display:flex; gap:12px; align-items:center;">
          <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="toggleArabic"> อาหรับ</label>
          <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="toggleThai"> ไทย</label>
          <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="toggleEnglish"> English</label>
        </div>
      <label>ฟอนต์และขนาด (Arabic font & sizes)</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="settingsArabicFontSelect" style="padding:6px">
          <option value="">(ระบบ)</option>
          <option value="Uthmanic Hafs">Uthmanic Hafs</option>
          <option value="KFGQPC Nastaleeq">KFGQPC Nastaleeq</option>
          <option value="PDMS Saleem Quran">PDMS Saleem Quran</option>
        </select>
        <input type="number" id="settingsArabicSizeInput" min="16" max="64" style="width:90px;padding:6px" placeholder="ขนาดอาหรับ (px)" />
        <input type="number" id="settingsTranslationSizeInput" min="10" max="36" style="width:110px;padding:6px" placeholder="ขนาดแปล (px)" />
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-action" id="btnSaveSettings" style="padding:8px 12px">บันทึก</button>
        <button class="btn-action" id="btnSaveCurrentAsDefault" style="padding:8px 12px">ตั้งค่าสถานะเป็นตำแหน่งปัจจุบัน</button>
        <button class="btn-action" id="btnClearDefault" style="padding:8px 12px">ล้างค่าเริ่มต้น</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast"></div>

<!-- Data Scripts -->
<script src="thai-mukhtasar.js"></script>
<script src="english-mukhtasar.js"></script>
<script src="surah_data.js"></script>
<script src="quran_uthmani_data.js"></script>
<script src="maqasid_data.js"></script>
<script src="maqasid_themes.js"></script>
<script src="script.js"></script>
</body>
</html>
