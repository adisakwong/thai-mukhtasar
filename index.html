<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อัลกุรอาน-ตัฟซีรมุคตะศ็อร </title>
<meta name="description" content="คัมภีร์อัลกุรอาน พร้อมตัฟซีรภาษาไทย มุคตะศ็อร (Mukhtasar) และคำแปลภาษาอังกฤษ พร้อมเสียงอ่านบทกุรอาน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header>
  <div class="bismillah-header">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <h1>อัลกุรอาน-ตัฟซีรมุคตะศ็อร</h1>
  <p>
    <span class="badge">เวอร์ชัน 1.0</span>
    <span>เลือกฟอนต์อาหรับ:</span>
    <select id="arabicFontSelect" style="background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px;">
      <option value="Uthmanic Hafs">Uthmanic Hafs</option>
      <option value="KFGQPC Nastaleeq">KFGQPC Nastaleeq</option>
      <option value="PDMS Saleem Quran">PDMS Saleem Quran</option>
    </select>
  </p>
</header>
  <!-- Surah Navigation Bar -->
  <div class="surah-nav-card">
    <button class="btn-nav" id="prevSurah" title="ซูเราะห์ก่อนหน้า">◀ ก่อนหน้า</button>
    <div class="surah-info-center">
      <div class="surah-badge-row">
        <span class="surah-num-tag" id="surahBadge">ซูเราะห์ที่ 1</span>
        <span class="surah-type-tag" id="surahType">มักกียะฮ์</span>
        <div class="surah-sub-meta">
          <span id="surahNameEn">Al-Fatihah</span>
          <span>•</span>
          <span id="surahAyahCount">7 อายะฮ์</span>
        </div>
      </div>
      <div class="surah-title-row">
        <h2 class="surah-title-th" id="surahName">อัลฟาติฮะห์</h2>
        <div class="surah-title-ar" id="surahNameAr">الفاتحة</div>
      </div>
    </div>
    <button class="btn-sel" id="openSurahSel">📖 เลือกซูเราะห์</button>
    <button class="btn-nav" id="nextSurah" title="ซูเราะห์ถัดไป">ถัดไป ▶</button>
  </div>

  <!-- Control Bar -->
  <div class="control-bar">
    <div class="toggle-group">
      <label class="toggle-item"><input type="checkbox" id="toggleArabic" checked> อาหรับ</label>
      <label class="toggle-item"><input type="checkbox" id="toggleThai" checked> ไทย</label>
      <label class="toggle-item"><input type="checkbox" id="toggleEnglish"> English</label>
    </div>

    <div class="tool-group">
      <!-- Mode Switch -->
      <button class="btn-action" id="btnToggleMode" title="เปลี่ยนรูปแบบการอ่าน">🎴 การ์ด</button>
      
      <!-- Play Surah -->
      <button class="btn-action" id="btnPlaySurah" title="ฟังเสียงอ่านทั้งซูเราะห์">▶ ฟังซูเราะห์</button>

      <!-- Font Size Adjuster -->
      <div class="font-size-ctrl">
        <button class="font-size-btn" id="btnFontDec" title="ลดขนาดตัวอักษร">A-</button>
        <button class="font-size-btn" id="btnFontInc" title="เพิ่มขนาดตัวอักษร">A+</button>
      </div>

      <!-- Jump to Ayah -->
      <div class="jump-box">
        <input type="number" id="jumpAyahInput" min="1" placeholder="อายะฮ์">
        <button class="btn-action" id="btnJumpAyah" style="padding:6px 10px">ไป</button>
      </div>

      <!-- Bookmarks Button -->
      <button class="btn-action" id="btnOpenBookmarks" title="รายการโปรด">⭐</button>
    </div>
  </div>

  <!-- Ayahs Render Area -->
  <div id="loading-msg">
    <div class="spinner"></div>
    <span>กำลังโหลดข้อมูลอัลกุรอาน...</span>
  </div>

  <div id="ayahs-container"></div>
  <div id="mushaf-container" style="display:none"></div>
</div>

<!-- Surah Selection Modal -->
<div class="modal-overlay" id="surahModal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>เลือกซูเราะห์ (Select Surah)</h2>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-search">
      <input type="text" id="surahSearch" placeholder="ค้นหาซูเราะห์ (ชื่อไทย, English, ชื่ออาหรับ, หมายเลข)...">
    </div>
    <div class="surah-grid" id="surahGrid"></div>
  </div>
</div>

<!-- Bookmarks Modal -->
<div class="modal-overlay" id="bookmarksModal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>รายการโปรดที่บันทึกไว้ (Bookmarks)</h2>
      <button class="modal-close" id="closeBookmarksModal">&times;</button>
    </div>
    <div id="bookmarksList" style="padding:20px; overflow-y:auto; flex:1"></div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast"></div>

<!-- Data Scripts -->
<script src="thai-mukhtasar.js"></script>
<script src="english-mukhtasar.js"></script>
<script src="surah_data.js"></script>
<script src="quran_uthmani_data.js"></script>
<script src="script.js"></script>
</body>
</html>
